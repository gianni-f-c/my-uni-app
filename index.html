/*
=========================================================
FUNZIONE PER MESCOLARE UN ARRAY
=========================================================

Utilizziamo Fisher-Yates per ottenere una
randomizzazione corretta.

=========================================================
*/

function shuffle(array) {

    const nuovoArray = [...array];

    for (let i = nuovoArray.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [nuovoArray[i], nuovoArray[j]] =
            [nuovoArray[j], nuovoArray[i]];
    }

    return nuovoArray;
}


/*
=========================================================
SELEZIONE RANDOM DELLE DOMANDE
=========================================================

Prende "numero" domande casuali dal gruppo.

=========================================================
*/

function selezionaDomande(domande, numero) {

    if (domande.length < numero) {

        console.error(
            `Sono necessarie almeno ${numero} domande, ` +
            `ma ne sono state inserite solo ${domande.length}.`
        );

        return shuffle(domande);
    }

    return shuffle(domande).slice(0, numero);
}

=========================================================

Ad ogni caricamento della pagina vengono selezionate:

43 Patologia
10 Lab
18 Onco

=========================================================
*/

    selezionaDomande(patologia, 43);

    selezionaDomande(lab, 10);

    selezionaDomande(onco, 18);

SALVIAMO LE DOMANDE DELLA SESSIONE
=========================================================

Servirà durante la correzione.

=========================================================
*/

    patologia: sessionePatologia,

    lab: sessioneLab,

    onco: sessioneOnco

};


/*
=========================================================
GENERAZIONE HTML DELLE DOMANDE
=========================================================
*/

function generaDomande(
    domande,
    contenitoreId,
    prefisso
) {

    const container =
        document.getElementById(contenitoreId);


    domande.forEach((domanda, index) => {

        const questionDiv =
            document.createElement("div");

        questionDiv.className = "question";


        /*
        TESTO DELLA DOMANDA
        */

        const questionText =
            document.createElement("div");

        questionText.className =
            "question-text";

        questionText.textContent =
            (index + 1) + ". " + domanda.question;


        questionDiv.appendChild(questionText);


        /*
        RISPOSTE
        */

        const optionsDiv =
            document.createElement("div");

        optionsDiv.className = "options";


        /*
        Creiamo le risposte mantenendo
        associata l'informazione sulla
        risposta corretta.
        */

        const options = domanda.options.map(
            (testo, indiceOriginale) => ({

                testo: testo,

                indiceOriginale: indiceOriginale

            })
        );


        /*
        Randomizziamo anche le risposte.
        */

        const optionsRandom =
            shuffle(options);


        optionsRandom.forEach(
            (option, optionIndex) => {

                const label =
                    document.createElement("label");

                label.className = "option";


                const input =
                    document.createElement("input");

                input.type = "radio";

                input.name =
                    prefisso + "-" + index;

                /*
                Salviamo l'indice originale
                della risposta.
                */

                input.value =
                    option.indiceOriginale;


                label.appendChild(input);


                label.appendChild(
                    document.createTextNode(
                        option.testo
                    )
                );


                optionsDiv.appendChild(label);

            }
        );


        questionDiv.appendChild(optionsDiv);

        container.appendChild(questionDiv);

    });

}


/*
=========================================================
GENERAZIONE DEL QUIZ
=========================================================
*/

generaDomande(
    sessione.patologia,
    "patologia",
    "patologia"
);

    sessione.lab,

);


generaDomande(
    sessione.onco,
    "onco",
    "onco"

/*
=========================================================
CORREZIONE DEL QUIZ
=========================================================
*/

function correggiQuiz() {

    let corrette = 0;

    let errate = 0;

    let nonDate = 0;

    let punteggio = 0;

    let totale = 0;


    const gruppi = [

        {
            domande: sessione.patologia,
            prefisso: "patologia"
        },

        {
            domande: sessione.lab,
            prefisso: "lab"
        },

        {
            domande: sessione.onco,
            prefisso: "onco"
        }

    ];


    /*
    ============================================
    CICLO SU TUTTE LE DOMANDE
    ============================================
    */

    gruppi.forEach(gruppo => {

        gruppo.domande.forEach(
            (domanda, index) => {

                totale++;


                const risposta =
                    document.querySelector(
                        `input[name="${gruppo.prefisso}-${index}"]:checked`
                    );


                /*
                DOMANDA NON RISPOSTA
                */

                if (!risposta) {

                    nonDate++;

                    return;

                }


                /*
                RISPOSTA CORRETTA
                */

                if (
                    Number(risposta.value) ===
                    domanda.correct
                ) {

                    corrette++;

                    punteggio += 1;

                }


                /*
                RISPOSTA ERRATA
                */

                else {

                    errate++;

                    punteggio -= 0.5;

                }

            }
        );

    });


    /*
    ============================================
    PERCENTUALE
    ============================================
    */

    const percentuale =
        (corrette / totale) * 100;


    /*
    ============================================
    RISULTATO
    ============================================
    */

    const result =
        document.getElementById("result");


    result.innerHTML = `

        <div>
            <strong>Risultato</strong>
        </div>

        <div class="score-details">

            Domande totali: ${totale}<br>

            Risposte corrette: ${corrette}
            → +${corrette} punti<br>

            Risposte errate: ${errate}
            → -${(errate * 0.5).toFixed(1)} punti<br>

            Non date: ${nonDate}
            → 0 punti<br>

            <br>

            <strong>
                Punteggio: ${punteggio.toFixed(1)} / ${totale}
            </strong>

            <br>

            Percentuale di risposte corrette:
            ${percentuale.toFixed(1)}%

        </div>
    `;


    /*
    ============================================
    SCROLL AL RISULTATO
    ============================================
    */

    result.scrollIntoView({
        behavior: "smooth"
    });

}
