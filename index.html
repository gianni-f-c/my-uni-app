           "tutti" 
       ],
       answer: 3,
      
   }
    
];

const batch3 = [ // Batch 3 per Parte 2 (Servono 6 domande estratte)
    { q: "B3_Q1: Cosa significa SQL?", options: ["Structured Query Language", "Simple Quote Language", "System Quality Logic", "Server Query List"], answer: 0 },
    { q: "B3_Q2: Quale comando legge i dati in SQL?", options: ["GET", "READ", "SELECT", "OPEN"], answer: 2 },
    { q: "B3_Q3: Quale comando inserisce nuovi dati?", options: ["ADD", "INSERT INTO", "UPDATE", "CREATE"], answer: 1 },
    { q: "B3_Q4: Come si eliminano dati in SQL?", options: ["REMOVE", "DELETE", "DROP", "ERASE"], answer: 1 },
    { q: "B3_Q5: Quale clausola filtra i risultati?", options: ["WHERE", "FILTER", "SEARCH", "HAVING"], answer: 0 },
    { q: "B3_Q6: Quale comando modifica dati esistenti?", options: ["MODIFY", "CHANGE", "UPDATE", "SAVE"], answer: 2 },
    { q: "B3_Q7: Cosa identifica univocamente una riga?", options: ["Foreign Key", "Primary Key", "Unique Code", "Index"], answer: 1 }
];

const batch4 = [ // Batch 4 per Parte 2 (Servono 6 domande estratte)
    { q: "B4_Q1: Cosa significa HTTP?", options: ["HyperText Transfer Protocol", "High Transfer Text Process", "Hyper Transfer Text Program", "Home Text Test Protocol"], answer: 0 },
    { q: "B4_Q2: Quale porta usa standard la connessione HTTPS?", options: ["80", "21", "443", "8080"], answer: 2 },
    { q: "B4_Q3: Quale codice indica 'Not Found'?", options: ["200", "500", "403", "404"], answer: 3 },
    { q: "B4_Q4: Quale metodo HTTP si usa per inviare dati riservati?", options: ["GET", "POST", "FETCH", "SEND"], answer: 1 },
    { q: "B4_Q5: Cos'è un indirizzo IP?", options: ["Un protocollo internet", "Un identificativo numerico di rete", "Un linguaggio di programmazione", "Un browser"], answer: 1 },
    { q: "B4_Q6: Quale formato è ampiamente usato per scambiare dati sul web?", options: ["JSON", "EXE", "DOCX", "PNG"], answer: 0 },
    { q: "B4_Q7: Cosa fa un server DNS?", options: ["Crea siti web", "Traduce nomi di dominio in IP", "Protegge dai virus", "Aumenta la RAM"], answer: 1 }
];

// STATO DEL QUIZ
let currentPart = 1;
let currentQuestions = [];
let currentIndex = 0;
let part1Score = 0;
let part2History = []; // Per memorizzare i dettagli per la revisione della Parte 2

// Funzione di utilità per estrarre N elementi casuali da un array (senza ripetizioni)
function getRandomQuestions(batch, count) {
    let shuffled = [...batch].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, count);
}

// AVVIO PARTE 1
function startPart1() {
    currentPart = 1;
    currentIndex = 0;
    part1Score = 0;
    currentQuestions = getRandomQuestions(batch0, 20);
    
    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("quiz-screen").classList.remove("hidden");
    document.getElementById("part-title").innerText = "Parte 1 - Selezione";
    
    showQuestion();
}

// AVVIO PARTE 2
function startPart2() {
    currentPart = 2;
    currentIndex = 0;
    part2History = [];
    
    // Composizione 30 domande: 12 da B1, 6 da B2, 6 da B3, 6 da B4
    const q1 = getRandomQuestions(batch1, 12);
    const q2 = getRandomQuestions(batch2, 6);
    const q3 = getRandomQuestions(batch3, 6);
    const q4 = getRandomQuestions(batch4, 6);
    
    // Unione e mescolamento di tutte le domande estratte
    currentQuestions = [...q1, ...q2, ...q3, ...q4].sort(() => 0.5 - Math.random());
    
    document.getElementById("part-title").innerText = "Parte 2 - Esame Finale";
    showQuestion();
}

// MOSTRA LA DOMANDA CORRENTE
function showQuestion() {
    const q = currentQuestions[currentIndex];
    
    // Reset UI
    document.getElementById("progress-text").innerText = `Domanda ${currentIndex + 1} di ${currentQuestions.length}`;
    document.getElementById("question-text").innerText = q.q;
    document.getElementById("feedback-area").className = "feedback hidden";
    document.getElementById("next-btn").classList.add("hidden");
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
    });
}

// VERIFICA RISPOSTA
function checkAnswer(selectedIndex) {
    const q = currentQuestions[currentIndex];
    const isCorrect = selectedIndex === q.answer;
    
    // Disabilita tutti i pulsanti delle opzioni
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => btn.disabled = true);

    // Evidenzia scelta grafica
    buttons[selectedIndex].style.borderColor = isCorrect ? "#2ecc71" : "#e74c3c";

    // Mostra Feedback Immediato
    const feedbackArea = document.getElementById("feedback-area");
    feedbackArea.classList.remove("hidden");
    
    if (isCorrect) {
        feedbackArea.className = "feedback correct";
        feedbackArea.innerText = "Risposta Corretta!";
        if (currentPart === 1) part1Score++;
    } else {
        feedbackArea.className = "feedback incorrect";
        feedbackArea.innerText = `Risposta Sbagliata! La risposta corretta era: "${q.options[q.answer]}"`;
    }

    // Salva lo storico se siamo nella Parte 2
    if (currentPart === 2) {
        part2History.push({
            question: q.q,
            options: q.options,
            userAnswer: selectedIndex,
            correctAnswer: q.answer,
            isCorrect: isCorrect
        });
    }

    document.getElementById("next-btn").classList.remove("hidden");
}

// AVANZA ALLA DOMANDA SUCCESSIVA O CONCLUDI LA PARTE
function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        if (currentPart === 1) {
            evaluatePart1();
        } else {
            showFinalReview();
        }
    }
}

// VALUTAZIONE PARTE 1
function evaluatePart1() {
    if (part1Score >= 17) {
        alert(`Complimenti! Hai superato la Parte 1 con ${part1Score}/20 risposte esatte. Ora verrai reindirizzato alla Parte 2.`);
        startPart2();
    } else {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("result-title").innerText = "Esame Non Superato";
        document.getElementById("result-desc").innerText = `Hai risposto correttamente a ${part1Score} domande su 5. Erano necessarie almeno 4 risposte esatte per accedere alla Parte 2.`;
    }
}

// MOSTRA REVISIONE FINALE (PARTE 2)
function showFinalReview() {
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    
    const correctCount = part2History.filter(h => h.isCorrect).length;
    document.getElementById("result-title").innerText = "Esame Completato!";
    document.getElementById("result-desc").innerText = `Punteggio Finale Parte 2: ${correctCount} / ${part2History.length} corrette. Di seguito trovi la revisione completa delle tue risposte.`;

    const reviewContainer = document.getElementById("review-container");
    reviewContainer.innerHTML = "";

    part2History.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = `review-card ${item.isCorrect ? 'correct-card' : 'incorrect-card'}`;
        
        card.innerHTML = `
            <strong>Domanda ${idx + 1}: ${item.question}</strong><br>
            <span style="color: ${item.isCorrect ? 'green' : 'red'};">
                Svolta: ${item.options[item.userAnswer]} ${item.isCorrect ? '✓' : '✗'}
            </span><br>
            ${!item.isCorrect ? `<span style="color: green;">Risposta Corretta: ${item.options[item.correctAnswer]}</span>` : ''}
        `;
        reviewContainer.appendChild(card);
    });
}
</script>
