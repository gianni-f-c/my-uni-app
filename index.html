// Funzione di utilità per estrarre N elementi casuali da un array (senza ripetizioni)
function getRandomQuestions(batch, count) {
    let shuffled = [...batch].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, count);
}

// AVVIO PARTE 1
function startPart1() {
    currentPart = 1;
    currentIndex = 0;
    part1Score = 0;
    currentQuestions = getRandomQuestions(batch0, 20);

    currentPart = 2;

    currentQuestions = [...q1, ...q2, ...q3, ...q4].sort(() => 0.5 - Math.random());

// MOSTRA LA DOMANDA CORRENTE
function showQuestion() {
    const q = currentQuestions[currentIndex];
    
    // Reset UI
    document.getElementById("progress-text").innerText = `Domanda ${currentIndex + 1} di ${currentQuestions.length}`;
    document.getElementById("question-text").innerText = q.q;
    document.getElementById("feedback-area").className = "feedback hidden";
    document.getElementById("next-btn").classList.add("hidden");
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
    });
}

// VERIFICA RISPOSTA
function checkAnswer(selectedIndex) {
    const q = currentQuestions[currentIndex];
    const isCorrect = selectedIndex === q.answer;

    buttons[selectedIndex].style.borderColor = isCorrect ? "#2ecc71" : "#e74c3c";

    const feedbackArea = document.getElementById("feedback-area");
    feedbackArea.classList.remove("hidden");
    
    if (isCorrect) {
        feedbackArea.className = "feedback correct";
        feedbackArea.innerText = "Risposta Corretta!";
        if (currentPart === 1) part1Score++;
    } else {
        feedbackArea.className = "feedback incorrect";
        feedbackArea.innerText = `Risposta Sbagliata! La risposta corretta era: "${q.options[q.answer]}"`;
    }

    // Salva lo storico se siamo nella Parte 2
    if (currentPart === 2) {
        part2History.push({
            question: q.q,
            options: q.options,
            userAnswer: selectedIndex,
            correctAnswer: q.answer,
            isCorrect: isCorrect
        });
    }

    document.getElementById("next-btn").classList.remove("hidden");
}

// AVANZA ALLA DOMANDA SUCCESSIVA O CONCLUDI LA PARTE
function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        if (currentPart === 1) {
            evaluatePart1();
        } else {
            showFinalReview();
        }
    }
}

// VALUTAZIONE PARTE 1
function evaluatePart1() {
    if (part1Score >= 17) {
        alert(`Complimenti! Hai superato la Parte 1 con ${part1Score}/20 risposte esatte. Ora verrai reindirizzato alla Parte 2.`);
        startPart2();
    } else {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("result-title").innerText = "Esame Non Superato";
        document.getElementById("result-desc").innerText = `Hai risposto correttamente a ${part1Score} domande su 5. Erano necessarie almeno 4 risposte esatte per accedere alla Parte 2.`;
    }
}

// MOSTRA REVISIONE FINALE (PARTE 2)
function showFinalReview() {
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    
    const correctCount = part2History.filter(h => h.isCorrect).length;
    document.getElementById("result-title").innerText = "Esame Completato!";
    document.getElementById("result-desc").innerText = `Punteggio Finale Parte 2: ${correctCount} / ${part2History.length} corrette. Di seguito trovi la revisione completa delle tue risposte.`;

    const reviewContainer = document.getElementById("review-container");
    reviewContainer.innerHTML = "";

    part2History.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = `review-card ${item.isCorrect ? 'correct-card' : 'incorrect-card'}`;
        
        card.innerHTML = `
            <strong>Domanda ${idx + 1}: ${item.question}</strong><br>
            <span style="color: ${item.isCorrect ? 'green' : 'red'};">
                Svolta: ${item.options[item.userAnswer]} ${item.isCorrect ? '✓' : '✗'}
            </span><br>
            ${!item.isCorrect ? `<span style="color: green;">Risposta Corretta: ${item.options[item.correctAnswer]}</span>` : ''}
        `;
        reviewContainer.appendChild(card);
    });
}
</script>
